name: Build and test

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag; empty for ordinary CI
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          test "$(uname -m)" = "$EXPECTED_ARCH"
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - name: Release tooling tests
        run: python3 -m unittest discover -s Tests/ReleaseToolsTests -v
      - name: Swift unit tests
        run: swift test --xunit-output .build/test-results.xml
      - name: Build app
        run: ./scripts/build.sh
      - name: Native editor checks in the runner VM
        run: ./scripts/test-native-ci.sh
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.arch }}
          path: |
            .build/test-results.xml
            .build/ci-logs/native.log
          include-hidden-files: true
          retention-days: 14

  package:
    name: Universal package
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and history
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release.py check --tag "$RELEASE_TAG"
          if [[ -n "$RELEASE_TAG" ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
      - name: Build Universal app
        run: ./scripts/build.sh --universal
      - name: Package and verify
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release.py package --tag "$RELEASE_TAG"
          python3 scripts/release.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jotlet-package
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
