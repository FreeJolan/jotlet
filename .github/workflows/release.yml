name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, for example v0.2.4
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  sign:
    name: Developer ID and notarization
    needs: checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout release tools from this workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .build/release-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jotlet-package
          path: dist/release
      - name: Validate source and extract checked app
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py check --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release.py verify
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          metadata = json.loads(Path('dist/release/release.json').read_text())
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if metadata['tag'] != os.environ['RELEASE_TAG'] or metadata['source_commit'] != commit or metadata['source_dirty']:
              raise SystemExit('Artifact does not match the clean tagged source.')
          subprocess.run(['ditto', '-x', '-k', str(Path('dist/release') / metadata['archive']), 'dist'], check=True)
          PY
      - uses: ./.build/release-tools/.github/actions/sign-notarize
        with:
          app: dist/Jotlet.app
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
      - name: Save notarized app for isolated runtime checks
        run: ditto -c -k --sequesterRsrc --keepParent dist/Jotlet.app .build/notarized-app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarized-app
          path: .build/notarized-app.zip
          retention-days: 7
          if-no-files-found: error
      - name: Repackage stapled app and verify distribution
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 .build/release-tools/scripts/release.py package --root "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --require-notarized --team-id "$APPLE_TEAM_ID"
          python3 .build/release-tools/scripts/release.py verify --root "$GITHUB_WORKSPACE" --require-notarized --team-id "$APPLE_TEAM_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jotlet-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Draft release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jotlet-release
          path: release
      - name: Verify checksums and create draft
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          metadata = json.loads(Path('release.json').read_text())
          tag = os.environ['RELEASE_TAG']
          if metadata['tag'] != tag:
              raise SystemExit('Artifact tag differs from requested release tag.')
          if metadata['signing'] != 'developer-id' or metadata['notarized'] is not True:
              raise SystemExit('Only signed and notarized packages may be released.')
          repo = os.environ['GITHUB_REPOSITORY']
          existing = subprocess.run(['gh', 'release', 'view', tag, '--repo', repo, '--json', 'isDraft'], capture_output=True, text=True)
          if existing.returncode == 0:
              if not json.loads(existing.stdout)['isDraft']:
                  raise SystemExit('Refusing to replace an already published release.')
              subprocess.run(['gh', 'release', 'edit', tag, '--repo', repo, '--notes-file', 'release-notes.md'], check=True)
              subprocess.run(['gh', 'release', 'upload', tag, '--repo', repo, '--clobber', metadata['archive'], 'release.json', 'SHA256SUMS'], check=True)
          else:
              command = ['gh', 'release', 'create', tag, '--repo', repo, '--verify-tag', '--draft', '--title', f'Jotlet {tag}', '--notes-file', 'release-notes.md']
              if metadata['prerelease']:
                  command.append('--prerelease')
              subprocess.run(command + [metadata['archive'], 'release.json', 'SHA256SUMS'], check=True)
          PY
