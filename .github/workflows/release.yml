name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, for example v0.2.3
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  draft:
    name: Draft release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jotlet-package
          path: release
      - name: Verify checksums and create draft
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          metadata = json.loads(Path('release.json').read_text())
          tag = os.environ['RELEASE_TAG']
          if metadata['tag'] != tag:
              raise SystemExit('Artifact tag differs from requested release tag.')
          repo = os.environ['GITHUB_REPOSITORY']
          existing = subprocess.run(['gh', 'release', 'view', tag, '--repo', repo, '--json', 'isDraft'], capture_output=True, text=True)
          if existing.returncode == 0:
              if not json.loads(existing.stdout)['isDraft']:
                  raise SystemExit('Refusing to replace an already published release.')
              subprocess.run(['gh', 'release', 'edit', tag, '--repo', repo, '--notes-file', 'release-notes.md'], check=True)
              subprocess.run(['gh', 'release', 'upload', tag, '--repo', repo, '--clobber', metadata['archive'], 'release.json', 'SHA256SUMS'], check=True)
          else:
              command = ['gh', 'release', 'create', tag, '--repo', repo, '--verify-tag', '--draft', '--title', f'Jotlet {tag}', '--notes-file', 'release-notes.md']
              if metadata['prerelease']:
                  command.append('--prerelease')
              subprocess.run(command + [metadata['archive'], 'release.json', 'SHA256SUMS'], check=True)
          PY
